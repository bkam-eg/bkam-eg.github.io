name: تحديث الأسعار

on:
  schedule:
    - cron: "17 */6 * * *"   # كل 6 ساعات
  workflow_dispatch:          # زرار "Run workflow" عشان تشغله بإيدك

permissions:
  contents: write
  pages: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تسطيب المكتبات
        run: pip install curl_cffi

      - name: سحب الأسعار
        run: python -u scraper/update_prices.py

      - name: مواصفات المنتجات (الجديدة بس)
        continue-on-error: true
        run: python -u scraper/fetch_specs.py

      - name: بناء صفحات المنتجات والأقسام و sitemap
        run: python scraper/build_pages.py

      - name: حفظ الأسعار الجديدة
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add products.json specs.json index.html sitemap.xml robots.txt p c m b
          python scraper/indexnow.py --staged --list > /tmp/changed.txt || true
          if git diff --cached --quiet; then
            echo "مفيش تغيير"
          else
            git commit -m "تحديث الأسعار"
            git pull --rebase --autostash -X theirs origin main
            git push
          fi

      - name: إعادة نشر الموقع
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: تبليغ Bing وYandex بالصفحات اللي اتغيرت (IndexNow)
        continue-on-error: true
        run: |
          sleep 120
          python scraper/indexnow.py $(cat /tmp/changed.txt 2>/dev/null)
