name: دوّر على المنتجات في متاجر تانية

# مرة في اليوم: يحمّل خريطة موقع كل متجر (فودافون، راية، رنين، زهران، الغزاوي)
# ويدوّر فيها على منتجاتنا، ويحفظ اللينكات اللي لقاها في links.json.
# تحديث الأسعار بعد كده بيفتح اللينكات دي كل 6 ساعات ويحدّث سعرها.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: البحث في خرايط المواقع
        env:
          DISCOVER_BUDGET: "2700"
        run: python -u scraper/discover.py
      - name: حفظ اللينكات
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add links.json
          if git diff --cached --quiet; then
            echo "مفيش لينكات جديدة"
          else
            git commit -m "لينكات منتجات من متاجر تانية"
            git pull --rebase -X theirs origin main
            git push
          fi
